# Remove the version line as it's obsolete in newer Docker Compose versions
services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16
    container_name: hrms_postgres
    user: "999:999"  # postgres user in container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Niazai007
      POSTGRES_DB: hr_system_test
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./hr_system_test.sql:/docker-entrypoint-initdb.d/hr_system_test.sql:ro
    ports:
      - "5432:5432"
    networks:
      - hrms-network
    restart: unless-stopped

  # FastAPI Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hrms_backend
    ports:
      - "8000:8000"
    environment:
      # Use the postgres service name instead of host.docker.internal
      DATABASE_URL: "postgresql://postgres:Niazai007@postgres:5432/hr_system_test"
    networks:
      - hrms-network
    depends_on:
      - postgres
    restart: unless-stopped

  # Next.js Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hrms_frontend
    ports:
      - "3001:3001"
    # Remove the volume mount that was overwriting the container
    # volumes:
    #   - ./frontend:/app
    networks:
      - hrms-network
    depends_on:
      - backend
    restart: unless-stopped

  # Prometheus Monitoring Service
  prometheus:
    image: prom/prometheus:v2.46.0
    container_name: prometheus
    user: "65534:65534"  # nobody user
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    networks:
      - hrms-network
    depends_on:
      - backend
    restart: unless-stopped

  # Grafana Visualization Service
  grafana:
    image: grafana/grafana:10.1.5
    container_name: grafana
    user: "472:0"  # grafana user
    ports:
      - "4000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    networks:
      - hrms-network
    depends_on:
      - prometheus
    restart: unless-stopped

networks:
  hrms-network:
    driver: bridge

volumes:
  grafana-storage:
    driver: local
  postgres-data:
    driver: local
